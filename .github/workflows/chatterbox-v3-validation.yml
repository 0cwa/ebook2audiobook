name: Chatterbox V3 Validation

on:
  push:
    branches:
      - chatterbox-v3
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed Python modules
        run: |
          python -m py_compile             components/Chatterbox/runtime/contract_data.py             components/Chatterbox/runtime/install.py             components/Chatterbox/runtime/measurement.py             components/Chatterbox/runtime/measurement_harness.py             components/Chatterbox/runtime/provisioning.py             components/Chatterbox/worker.py             lib/classes/tts_engines/chatterbox.py             lib/classes/tts_engines/presets/chatterbox_presets.py             lib/conf_models.py             lib/gradio.py
      - name: Run dependency-light Chatterbox tests
        run: |
          python -m unittest discover -s components/Chatterbox -p 'test_*.py' -v
      - name: Validate V3 manifest and UI preset fallback
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          from components.Chatterbox.runtime.provisioning import validate_manifest_identity

          manifest = json.loads(
              Path("components/Chatterbox/runtime/runtime-manifest-v3.json").read_text()
          )
          result = validate_manifest_identity(manifest)
          assert result["ok"], result
          model = manifest["sources"]["model"]
          assert model["variant"] == "multilingual-v3"
          assert sum(item["size_bytes"] for item in model["files"]) == 3208951924

          source = Path("lib/gradio.py").read_text()
          tree = ast.parse(source)
          fn = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "_select_fine_tuned_preset"
          )
          namespace = {"default_fine_tuned": "internal"}
          exec(compile(ast.Module([fn], type_ignores=[]), "<preset-helper>", "exec"), namespace)
          select = namespace["_select_fine_tuned_preset"]
          assert select("internal", ["v2", "v3"]) == "v2"
          assert select("v3", ["v2", "v3"]) == "v3"
          assert select("custom", ["internal", "v3"]) == "internal"
          PY
