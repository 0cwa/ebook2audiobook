name: Chatterbox V3 branch validation

on:
  push:
    branches:
      - chatterbox-v3

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile changed Python modules
        run: |
          python -m py_compile             components/Chatterbox/runtime/contract_data.py             components/Chatterbox/runtime/install.py             components/Chatterbox/runtime/provisioning.py             components/Chatterbox/worker.py             lib/classes/tts_engines/chatterbox.py             lib/classes/tts_engines/presets/chatterbox_presets.py             lib/conf_models.py             lib/gradio.py
      - name: Run dependency-light Chatterbox tests
        run: |
          python -m unittest -v             components.Chatterbox.tests.test_worker             components.Chatterbox.runtime.tests.test_runtime             components.Chatterbox.tests.test_adapter
